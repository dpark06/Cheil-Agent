services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheil_delta
      POSTGRES_PASSWORD: cheil_delta_dev
      POSTGRES_DB: cheil_delta
    ports:
      - "5433:5432"
    volumes:
      - cheil_delta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheil_delta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cheil_delta_pgdata:
